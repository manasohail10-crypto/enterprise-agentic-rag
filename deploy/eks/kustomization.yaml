# The EKS version of the app (Step 18). ArgoCD on EKS watches THIS folder.
# It takes everything from k8s/ and changes 4 things:
#   1. the API Deployment is removed and replaced by the canary Rollout
#   2. the images come from your ECR (newName) with the tag Jenkins writes (newTag)
#   3. the database disk uses the gp3 StorageClass
#   4. a second Service (api-canary) and the AnalysisTemplate (the check) are added
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../k8s
  - rollout-api.yaml
  - api-canary-service.yaml
  - analysis-api-ready.yaml
  - storageclass-gp3.yaml

patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
        namespace: enterprise-rag
  - target:
      kind: StatefulSet
      name: postgres
    patch: |-
      - op: add
        path: /spec/volumeClaimTemplates/0/spec/storageClassName
        value: gp3

# CHANGE ONCE: replace 123456789012 with your AWS account number (terraform output ecr_registry).
# Jenkins changes only the newTag lines (both images get the same tag).
images:
  - name: anassohail22/enterprise-rag-api
    newName: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/enterprise-rag-api
    newTag: latest
  - name: anassohail22/enterprise-rag-ui
    newName: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/enterprise-rag-ui
    newTag: latest