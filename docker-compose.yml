# docker-compose.yml  ->  starts the whole app (API + chat page) with one command
#
#   docker compose up --build -d     build and start
#   docker compose logs -f api       watch the API logs
#   docker compose down              stop and remove the containers
#
# Needs a ".env" file next to this file (your secret keys). The .env is NOT copied into the images.

name: enterprise-rag

services:
  # The database that keeps the chat memory (LangGraph checkpoints).
  # No "ports:" on purpose: only the API (inside the Docker network) talks to it.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_local_password}
      POSTGRES_DB: rag
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U rag -d rag" ]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: enterprise-rag-api:local
    # All keys in .env (GROQ_API_KEY, QDRANT_API_KEY, ...) become environment variables inside this container.
    env_file: .env
    environment:
      # This line wins over POSTGRES_URI in your .env file.
      # Your .env says "localhost", but inside a container "localhost" means the container itself.
      # Here we point to the "postgres" service above. Your .env stays correct for running without Docker.
      POSTGRES_URI: postgresql://rag:${POSTGRES_PASSWORD:-rag_local_password}@postgres:5432/rag
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: enterprise-rag-ui:local
    # The UI gets only what it needs. It does NOT get your other secret keys.
    # Inside the Docker network the API is reached by its service name: "api".
    environment:
      RAG_API_URL: http://api:8000
      API_KEY: ${API_KEY:-}
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Keeps the database files when you stop the containers.
  # "docker compose down" keeps this data. "docker compose down -v" deletes it.
  pgdata:
